[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "admit"
version = "0.1.0"
description = "给自建 Agent 的准入判断层：该不该主动动手"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "韦申念", email = "nianyvcatfish@users.noreply.github.com" }]
keywords = ["agent", "policy", "automation", "gate", "admission"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
admit = "admit.cli:main"

[tool.setuptools]
packages = ["admit"]